<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bypass Smart Exam Browser</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-user-select: none; /* Anti copas teks */
            user-select: none;
        }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #f0f2f5; 
            color: #333; 
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
        }

        /* --- Halaman Depan / Setup --- */
        #setup-screen { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            width: 100vw; 
            padding: 20px; 
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            background: #f0f2f5;
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.15); 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
        }
        .card h2 { 
            margin-bottom: 8px; 
            color: #007bff;
            font-size: 24px;
        }
        .card p.subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }
        input[type="url"] { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 15px; 
            border: 2px solid #ced4da; 
            border-radius: 8px; 
            font-size: 16px; 
            outline: none;
            transition: 0.3s;
        }
        input[type="url"]:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.2);
        }
        
        button { 
            padding: 14px 20px; 
            font-size: 16px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.2s; 
        }
        .btn-primary { 
            background: #007bff; 
            color: white; 
            width: 100%; 
            margin-bottom: 10px; 
            box-shadow: 0 4px 12px rgba(0,123,255,0.3);
        }
        .btn-primary:hover { background: #0056b3; }
        .btn-secondary { 
            background: #28a745; 
            color: white; 
            width: 100%; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 12px rgba(40,167,69,0.3);
        }
        .btn-secondary:hover { background: #218838; }
        
        #reader { 
            width: 100%; 
            margin-bottom: 20px; 
            display: none; 
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #28a745;
        }

        /* --- Halaman Frame Ujian --- */
        #exam-screen { 
            display: none; 
            flex-direction: column; 
            height: 100vh; 
            width: 100vw; 
            background: #fff; 
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
        }
        iframe { 
            flex: 1; 
            width: 100%; 
            height: calc(100vh - 60px);
            border: none; 
        }

        /* Navigasi Control Bawah */
        #bottom-bar { 
            height: 60px; 
            background: #1e293b; 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 15px; 
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
        }
        .info-bar { 
            display: flex; 
            flex-direction: column; 
            font-size: 13px; 
        }
        .info-bar span { 
            margin: 1px 0; 
            font-weight: 500; 
            color: #cbd5e1;
        }
        #time-display { color: #fff; font-weight: bold; }
        
        .nav-buttons { display: flex; gap: 10px; }
        .btn-nav { 
            background: #334155; 
            color: white; 
            padding: 8px 14px; 
            font-size: 14px; 
            border-radius: 6px; 
        }
        .btn-nav:hover { background: #475569; }
        .btn-exit { 
            background: #ef4444; 
            color: white; 
            padding: 8px 16px; 
            border-radius: 6px;
        }
        .btn-exit:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div class="card">
            <h2>Exam Browser Pro</h2>
            <p class="subtitle">Sistem Anti Blokir Iframe & Deteksi Pintar</p>
            
            <div id="reader"></div>
            <button class="btn-secondary" id="btn-scan" onclick="toggleScanner()">📷 Scan QR Soal</button>
            
            <p style="margin-bottom: 10px; font-size: 14px; color: #555; font-weight: bold;">Atau Input Link Manual / Acak:</p>
            <input type="url" id="url-input" placeholder="Masukkan link web / form / youtube">
            <button class="btn-primary" onclick="masukUjian()">Mulai Ujian Sekarang 🚀</button>
        </div>
    </div>

    <div id="exam-screen">
        <iframe id="exam-frame" src="" allow="camera; microphone; geolocation;"></iframe>
        <div id="bottom-bar">
            <div class="info-bar">
                <span id="time-display">Jam: --:--:--</span>
                <span id="battery-display">Baterai: Memuat...</span>
            </div>
            <div class="nav-buttons">
                <button class="btn-nav" onclick="refreshFrame()">🔄 Refresh</button>
                <button class="btn-exit" onclick="keluarUjian()">❌ Keluar</button>
            </div>
        </div>
    </div>

    <script>
        let html5QrCode;
        let isScanning = false;
        let clockInterval;

        // Kontrol Kamera Scanner QR
        function toggleScanner() {
            if (!html5QrCode) { html5QrCode = new Html5Qrcode("reader"); }
            if (isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById("reader").style.display = "none";
                    isScanning = false;
                    document.getElementById("btn-scan").innerText = "📷 Scan QR Soal";
                });
            } else {
                document.getElementById("reader").style.display = "block";
                html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 15, qrbox: { width: 250, height: 250 } },
                    (decodedText) => {
                        document.getElementById('url-input').value = decodedText;
                        toggleScanner();
                        alert("QR Code Berhasil Dibaca!");
                    },
                    (err) => {}
                ).catch(err => alert("Izin kamera ditolak atau error: " + err));
                isScanning = true;
                document.getElementById("btn-scan").innerText = "🛑 Tutup Kamera";
            }
        }

        // Eksekusi Pindah ke Mode Ujian
        function masukUjian() {
            let inputUrl = document.getElementById('url-input').value.trim();
            if (!inputUrl) {
                alert("Peringatan: Silakan isi atau scan link ujian terlebih dahulu!");
                return;
            }

            // Standarisasi skema URL
            if (!/^https?:\/\//i.test(inputUrl)) {
                inputUrl = 'https://' + inputUrl;
            }

            // Aktifkan Fitur Layar Penuh Otomatis
            let elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => console.log("Fullscreen diblokir browser"));
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            }

            // Sembunyikan setup, munculkan ruang ujian
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('exam-screen').style.display = 'flex';
            
            // Generate link enkripsi melalui Reverse Proxy Node.js kita di Vercel
            const proxyEndpoint = window.location.origin + '/api/proxy?url=' + encodeURIComponent(inputUrl);
            document.getElementById('exam-frame').src = proxyEndpoint;

            // Jalankan widget info bawah
            updateTime();
            clockInterval = setInterval(updateTime, 1000);
            updateBattery();
        }

        function refreshFrame() {
            let iframe = document.getElementById('exam-frame');
            if(iframe.src) {
                iframe.src = iframe.src;
            }
        }

        function keluarUjian() {
            if (confirm("Apakah Anda yakin ingin menyelesaikan dan keluar dari halaman ujian?")) {
                clearInterval(clockInterval);
                if (document.exitFullscreen) { 
                    document.exitFullscreen().catch(err => {}); 
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
                document.getElementById('exam-frame').src = "";
                document.getElementById('exam-screen').style.display = 'none';
                document.getElementById('setup-screen').style.display = 'flex';
            }
        }

        function updateTime() {
            const now = new Date();
            document.getElementById('time-display').innerText = `Jam: ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
        }

        function updateBattery() {
            if ('getBattery' in navigator) {
                navigator.getBattery().then(function(battery) {
                    function info(){
                        document.getElementById('battery-display').innerText = `Baterai: ${Math.round(battery.level * 100)}%${battery.charging ? " (⚡ Mengisi daya)" : ""}`;
                    }
                    info();
                    battery.addEventListener('levelchange', info);
                    battery.addEventListener('chargingchange', info);
                });
            } else {
                document.getElementById('battery-display').innerText = "Baterai: Tidak Didukung Browser";
            }
        }
    </script>
</body>
</html>
